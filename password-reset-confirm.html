    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/password-reset.css">
</head>
<body class="public-page">

<!-- ====== NAVBAR ====== -->
<nav class="login-navbar">
    <div class="login-nav-container">
        <a href="index.html" class="login-logo">FarmConnect</a>
        <button class="login-menu-toggle" id="loginMenuToggle" aria-label="Toggle navigation">
            <i class="fas fa-bars"></i>
        </button>
        <div class="login-nav-links" id="loginNavLinks">
            <ul class="login-nav-menu">
                <li><a href="index.html">Home</a></li>

                <li><a href="farmers.html">Farmers</a></li>
                <li><a href="logistics.html">Logistics</a></li>

                <li><a href="contact.html">Contact</a></li>

                <button class="home-navbar-btn dark-mode-toggle" id="darkModeToggle" aria-label="Toggle dark mode">
                    <i class="fas fa-moon"></i>

                    <a href="login.html" class="home-btn home-btn-primary home-btn-sm home-btn-login">Login</a>

</nav>

<main>
    <section class="password-reset-section">
        <div class="password-reset-container">
            <div class="password-reset-card">
                <div class="password-reset-icon">
                    <i class="fas fa-key"></i>
                </div>
                <h1 class="password-reset-title">Create New Password</h1>
                <p class="password-reset-subtitle">Enter your new password below.</p>
                
                <form id="resetConfirmForm" class="password-reset-form">
                    <div class="password-reset-input-group">
                        <div class="password-reset-input-icon">
                            <i class="fas fa-lock"></i>
                        </div>
                        <input type="password" id="resetNewPassword" class="password-reset-input" placeholder="New Password" required minlength="6">
                        <button type="button" class="password-reset-password-toggle" id="toggleNewPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    
                    <div class="password-reset-input-group">
                        <div class="password-reset-input-icon">
                            <i class="fas fa-lock"></i>
                        </div>
                        <input type="password" id="resetConfirmPassword" class="password-reset-input" placeholder="Confirm Password" required minlength="6">
                        <button type="button" class="password-reset-password-toggle" id="toggleConfirmPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    
                    <div class="password-reset-password-requirements">
                        <span class="password-reset-requirement" id="reqLength">
                            <i class="fas fa-circle"></i> At least 6 characters
                        </span>
                        <span class="password-reset-requirement" id="reqMatch">
                            <i class="fas fa-circle"></i> Passwords match
                        </span>
                    </div>
                    
                    <button type="submit" class="password-reset-btn password-reset-btn-primary" id="resetConfirmBtn">
                        Reset Password
                    </button>
                </form>
            </div>
        </div>
    </section>
</main>

<!-- ====== TOAST ====== -->
<div class="password-reset-toast-container" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
