<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login | FarmConnect Marketplace</title>
    <!-- Bootstrap 5.3 grid & utilities -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <!-- Main CSS -->
    <link rel="stylesheet" href="../assets/css/main.css">
    <!-- Login Page CSS -->
    <link rel="stylesheet" href="../assets/css/login.css">
</head>
<body>

<!-- ==================== NAVBAR ==================== -->
<nav class="login-navbar">
    <div class="login-nav-container">
        <a href="index.html" class="login-logo">FarmConnect</a>
        <button class="login-menu-toggle" id="loginMenuToggle" aria-label="Toggle navigation">
            <i class="fas fa-bars"></i>
        </button>
        <div class="login-nav-links" id="loginNavLinks">
            <ul class="login-nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="marketplace.html">Marketplace</a></li>
                <li><a href="farmers.html">Farmers</a></li>
                <li><a href="logistics.html">Logistics</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li class="home-nav-cta-wrapper home-btn-login-register" >
                    <a href="login.html" class="home-btn home-btn-primary home-btn-sm home-btn-login">Login</a>
                    <a href="register.html" class="home-btn home-btn-outline-light home-btn-sm home-btn-register">Register</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ==================== LOGIN FORM SECTION ==================== -->
<main class="login-main">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Welcome Back to <span class="login-accent">FarmConnect</span></h1>
                <p>Login to access your marketplace dashboard</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="login-input-group">
                    <label for="loginEmail">Email Address</label>
                    <div class="login-input-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="loginEmail" name="email" placeholder="hello@farmconnect.com" required>
                    </div>
                </div>
                
                <div class="login-input-group">
                    <label for="loginPassword">Password</label>
                    <div class="login-input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="loginPassword" name="password" placeholder="Enter your password" required>
                        <button type="button" id="loginTogglePassword" class="login-toggle-password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="login-options">
                    <label class="login-checkbox">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="login-forgot">Forgot Password?</a>
                </div>
                
                <button type="submit" class="login-btn">Login</button>
            </form>
            
            <div class="login-footer">
                <p>Don't have an account? <a href="register.html">Register here</a></p>
            </div>
        </div>
    </div>
</main>

<!-- Main JS -->
<script src="../assets/js/main.js"></script>
<!-- Login Page JS -->
<script src="../assets/js/login.js"></script>
</body>
</html>
