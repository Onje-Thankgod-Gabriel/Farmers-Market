<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Register | FarmConnect Marketplace</title>
    <!-- Bootstrap 5.3 grid & utilities -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <!-- Main CSS -->
    <link rel="stylesheet" href="../assets/css/main.css">
    <!-- Register Page CSS -->
    <link rel="stylesheet" href="../assets/css/register.css">
</head>
<body class="public-page">

<!-- ==================== NAVBAR ==================== -->
<nav class="login-navbar">
    <div class="login-nav-container">
        <a href="index.html" class="login-logo">FarmConnect</a>
        <button class="login-menu-toggle" id="loginMenuToggle" aria-label="Toggle navigation">
            <i class="fas fa-bars"></i>
        </button>
        <div class="login-nav-links" id="loginNavLinks">
            <ul class="login-nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="marketplace.html">Marketplace</a></li>
                <li><a href="farmers.html">Farmers</a></li>
                <li><a href="logistics.html">Logistics</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <!-- Add this inside the navbar-right section -->
                <button class="home-navbar-btn dark-mode-toggle" id="darkModeToggle" aria-label="Toggle dark mode">
                    <i class="fas fa-moon"></i>
                </button>
                <li class="home-nav-cta-wrapper home-btn-login-register" >
                    <a href="login.html" class="home-btn home-btn-primary home-btn-sm home-btn-login">Login</a>
                    <!-- <a href="register.html" class="home-btn home-btn-outline-light home-btn-sm home-btn-register">Register</a> -->
                </li>
            </ul>
        </div>
    </div>
</nav>
<!-- ==================== REGISTER FORM SECTION ==================== -->
<main class="register-main">
    <div class="register-container">
        <div class="register-card">
            <div class="register-header">
                <h1>Create Your <span class="register-accent">FarmConnect</span> Account</h1>
                <p>Join the agricultural marketplace</p>
            </div>
            
            <!-- User Type Toggle -->
            <div class="register-user-type">
                <button type="button" id="registerFarmerBtn" class="register-type-btn active">
                    <i class="fas fa-tractor"></i> Farmer
                </button>
                <button type="button" id="registerBuyerBtn" class="register-type-btn">
                    <i class="fas fa-shopping-bag"></i> Buyer
                </button>
                <button type="button" id="registerLogisticsBtn" class="register-type-btn">
                    <i class="fas fa-truck"></i> Logistics
                </button>
            </div>
            
            <form id="registerForm" class="register-form">
                <!-- Common Fields -->
                <div id="commonFields">
                    <div class="register-input-group">
                        <label for="registerFullName">Full Name *</label>
                        <div class="register-input-icon">
                            <i class="fas fa-user"></i>
                            <input type="text" id="registerFullName" placeholder="Enter your full name" required>
                        </div>
                    </div>
                    
                    <div class="register-input-group">
                        <label for="registerEmail">Email Address *</label>
                        <div class="register-input-icon">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="registerEmail" placeholder="hello@farmconnect.com" required>
                        </div>
                    </div>
                    
                    <div class="register-input-group">
                        <label for="registerPhone">Phone Number *</label>
                        <div class="register-input-icon">
                            <i class="fab fa-whatsapp"></i>
                            <input type="tel" id="registerPhone" placeholder="+234 XXX XXX XXXX" required>
                        </div>
                    </div>

                    <div class="register-input-group">
                        <label for="registerPhone">WhatsApp Number*</label>
                        <div class="register-input-icon">
                            <i class="fab fa-whatsapp"></i>
                            <input type="tel" id="registerPhone" placeholder="+234 XXX XXX XXXX" required>
                        </div>
                    </div>
                </div>
                
                <!-- Farmer Fields (default visible) -->
                <div id="farmerFields">
                    <div class="register-input-group">
                        <label for="registerFarmName">Farm Name</label>
                        <div class="register-input-icon">
                            <i class="fas fa-seedling"></i>
                            <input type="text" id="registerFarmName" placeholder="e.g., Green Acres Farm">
                        </div>
                    </div>
                    <div class="register-input-group">
                        <label for="registerLocation">Location *</label>
                        <div class="register-input-icon">
                            <i class="fas fa-map-marker-alt"></i>
                            <select id="registerLocation">
                                <option value="">Select location</option>
                                <option value="Lagos">Lagos</option>
                                <option value="Abuja">Abuja</option>
                                <option value="Ibadan">Ibadan</option>
                                <option value="Kano">Kano</option>
                                <option value="Port Harcourt">Port Harcourt</option>
                                <option value="Kaduna">Kaduna</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <!-- Buyer Fields (hidden by default) -->
                <div id="buyerFields" style="display: none;">
                    <div class="register-input-group">
                        <label for="registerBuyerLocation">Location *</label>
                        <div class="register-input-icon">
                            <i class="fas fa-map-marker-alt"></i>
                            <select id="registerBuyerLocation">
                                <option value="">Select location</option>
                                <option value="Lagos">Lagos</option>
                                <option value="Abuja">Abuja</option>
                                <option value="Ibadan">Ibadan</option>
                                <option value="Kano">Kano</option>
                                <option value="Port Harcourt">Port Harcourt</option>
                                <option value="Kaduna">Kaduna</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <!-- Logistics Fields (hidden by default) -->
                <div id="logisticsFields" style="display: none;">
                    <div class="register-input-group">
                        <label for="registerCompanyName">Company Name *</label>
                        <div class="register-input-icon">
                            <i class="fas fa-building"></i>
                            <input type="text" id="registerCompanyName" placeholder="Enter company name">
                        </div>
                    </div>
                    <div class="register-input-group">
                        <label for="registerServiceType">Service Type *</label>
                        <div class="register-input-icon">
                            <i class="fas fa-truck"></i>
                            <select id="registerServiceType">
                                <option value="">Select service</option>
                                <option value="Transportation">Transportation</option>
                                <option value="Storage">Storage</option>
                                <option value="Distribution">Distribution</option>
                                <option value="Cold Chain">Cold Chain</option>
                                <option value="Freight">Freight</option>
                            </select>
                        </div>
                    </div>
                    <div class="register-input-group">
                        <label for="registerCoverageArea">Coverage Area *</label>
                        <div class="register-input-icon">
                            <i class="fas fa-map-marked-alt"></i>
                            <select id="registerCoverageArea">
                                <option value="">Select coverage area</option>
                                <option value="Lagos">Lagos</option>
                                <option value="Abuja">Abuja</option>
                                <option value="Ibadan">Ibadan</option>
                                <option value="Kano">Kano</option>
                                <option value="Port Harcourt">Port Harcourt</option>
                                <option value="Kaduna">Kaduna</option>
                                <option value="Nationwide">Nationwide</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <!-- Password Fields -->
                <div class="register-input-group">
                    <label for="registerPassword">Password *</label>
                    <div class="register-input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="registerPassword" placeholder="Create a password (min. 6 characters)" required>
                        <button type="button" id="registerTogglePassword" class="register-toggle-password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="register-input-group">
                    <label for="registerConfirmPassword">Confirm Password *</label>
                    <div class="register-input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="registerConfirmPassword" placeholder="Confirm your password" required>
                    </div>
                </div>
                
                <button type="submit" class="register-btn">Create Account</button>
            </form>
            
            <div class="register-footer">
                <p>Already have an account? <a href="login.html">Login here</a></p>
            </div>
        </div>
    </div>
</main>

<!-- Main JS -->
<script src="../assets/js/main.js"></script>
<!-- Register Page JS -->
<script src="../assets/js/register.js"></script>
</body>
</html>
